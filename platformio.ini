[platformio]
; Bare `pio run` builds only the firmware; the host test env is opt-in via
; `pio test -e native`.
default_envs = esp32-usage-monitor

; Shared ESP32 firmware settings. Kept out of [env] so the host `native` test
; env does not inherit `framework = arduino` / lib_deps.
[esp32_base]
; PRE hooks: the generated LVGL fonts (they live outside src/ so they stay out of
; repo-wide searches), and the `uploadfs` guard, because that target erases the
; device's rotated OAuth tokens — see tools/uploadfs_guard.py.
extra_scripts =
    pre:tools/build_fonts.py
    pre:tools/uploadfs_guard.py
; Arduino core 3.1.1 (IDF 5.3.2). Do NOT use 3.1.2/3.1.3: those shipped
; prebuilt I2S libs with CONFIG_GDMA_ISR_IRAM_SAFE=y but CONFIG_I2S_ISR_IRAM_SAFE
; unset, so the I2S driver allocates its channel in PSRAM and GDMA rejects it
; ("user context not in internal RAM", IDFGH-14800) — no audio. Arduino 3.2.x
; fixes it but its platform ships esptool 5.x, which breaks with system click.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = ota_8mb.csv
; Wireless firmware update: the app runs an ArduinoOTA server (src/ota.cpp) and
; the table above has two 3 MB app slots, so `pio run -e esp32-ota -t upload`
; writes the *other* slot and reboots into it — LittleFS (config + the rotated
; OAuth tokens) is untouched, unlike `uploadfs`.
;
; Only `-t upload` works over the air; the filesystem and the partition table
; still need USB. The device must have been flashed with this firmware once over
; USB first; after that `--upload-port <ip>` is enough.
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    -DBOARD_WAVESHARE_ESP32S3_TOUCH_AMOLED_2_16
    -DCFG_TUSB_MCU=OPT_MCU_ESP32S3
    -DCFG_TUD_ENABLED=1
    -DCONFIG_ESP_WEBSOCKET_CLIENT
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include

; Versions are pinned exactly so CI and local builds resolve the same code;
; bump deliberately (and re-run `pio run`/`pio test -e native`) when upgrading.
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.6
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.4.1
    adafruit/Adafruit BusIO @ 1.17.4
    bblanchon/ArduinoJson @ 7.4.3
    lvgl/lvgl @ 8.4.0


[env:esp32-usage-monitor]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.arduino.usb_stack = TINYUSB


; Same firmware, uploaded over WiFi by espota instead of USB. Kept as a separate
; env on purpose: `upload_protocol` in [esp32_base] would re-route the everyday
; `pio run -t upload` / `-t uploadfs` workflow through the network.
;
;   pio run -e esp32-ota -t upload --upload-port 192.168.1.42
;
; The device password comes from config.json (`ota_password`, required, >= 12
; chars) and espota must send the same one. `tools/ota.sh [ip]` fills OTA_AUTH in
; from config.json; to do it by hand, keep the secret out of the repo:
;
;   OTA_AUTH=<password> pio run -e esp32-ota -t upload --upload-port <ip>
;
; Without a password the device does not start the OTA server at all (it logs
; `ota: DISABLED`), so there is no unauthenticated update path.
[env:esp32-ota]
extends = env:esp32-usage-monitor
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_AUTH}


; Host-side unit tests for the dependency-free helpers in src/util and the
; header-only parsers in src/parse. Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
; LVGL is firmware-only; never compile it into the host test build.
lib_ignore = lvgl
; poller.cpp is pure logic (no Arduino/ESP-IDF), so build it for the host tests
; too — the rest of src/ is firmware-only and must not be compiled here.
test_build_src = yes
build_src_filter = +<poller.cpp>
build_flags =
    -Isrc
    -Isrc/util
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
