name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host unit tests (src/util + src/parse)
        run: pio test -e native

      - name: Firmware build
        run: pio run -e esp32-usage-monitor
